# Held-out retrieval questions: a second test set the system has never been tuned on.
# Write ~20 questions the way you would really ask them. Labels come later
# (Claude builds a candidate list per question; you mark relevant / acceptable / no).
#
# Fields per question:
#   question       what you would type in the dashboard chat (English or Vietnamese;
#                  Vietnamese gets translated to English the same way the chat does)
#   in_possession  true = your team has the ball, false = the opponent has it
#   phase_of_play  open_play | attacking_transition (just won the ball) |
#                  defensive_transition (just lost it) | set_piece
#
# Tips for a useful test:
#   - Don't look at concept names first. Ask in your own words, not textbook terms.
#   - Mix topics: build-up, chance creation, pressing, defending deep, transitions,
#     set pieces, goalkeeper, individual decisions (pass / dribble / shoot / hold).
#   - Mix lengths and styles: short ("how do we beat their press?") and specific
#     situations ("our 6 is marked and their 9 blocks the pass to our centre-back...").
#
# Example (delete it or keep it as h00):
