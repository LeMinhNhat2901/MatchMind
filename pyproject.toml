[tool.poetry]
name = "matchmind"
version = "1.0.0"
description = "MatchMind — Real-Time Multi-Agent Football Tactical Intelligence"
authors = ["MatchMind Team"]
readme = "README.md"
packages = [{ include = "matchmind", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"

# Core schema & validation
pydantic = "^2.7"
pydantic-settings = "^2.3"

# Agent framework
langgraph = ">=0.2.28"
langchain-core = ">=0.2"

# LLM providers — Gemini is the default (see matchmind/llm_client.py);
# anthropic + openai stay installed as drop-in fallbacks.
google-genai = ">=1.0"
anthropic = "^0.34"
openai = "^1.40"

# Vector store & embeddings
chromadb = "^0.5.5"
sentence-transformers = "^3.0"

# Football data
statsbombpy = "^1.0"
kloppy = "^3.15"

# API & web
fastapi = "^0.111"
uvicorn = { version = "^0.30", extras = ["standard"] }
websockets = ">=13.0,<17.0"
python-multipart = "^0.0.9"

# Database
redis = { version = "^5.0", extras = ["hiredis"] }
sqlalchemy = "^2.0"
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
alembic = "^1.13"

# Dashboard
streamlit = "^1.36"
plotly = "^5.22"

# Data science & visualization
matplotlib = "^3.9"
numpy = "^1.26"
pandas = "^2.2"
scipy = "^1.13"

# Utilities
python-dotenv = "^1.0"
structlog = "^24.1"
tenacity = "^8.3"
httpx = "^0.27"
aiofiles = "^24.1"
rich = "^13.7"
typer = "^0.12"
click = ">=8.1,<8.2"   # typer 0.12.x breaks with click>=8.2 ("Secondary flag ... non-boolean")

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
pre-commit = "^3.7"

[tool.poetry.scripts]
matchmind-build-kb = "matchmind.scripts.build_kb:main"
matchmind-demo = "matchmind.scripts.demo:main"
matchmind-eval = "matchmind.scripts.run_evaluation:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
